<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resnick Email Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Archivo+Black&display=swap">
<style>
:root{--g:#0E5C2F;--g2:#0A4724;--gl:#EEF5EF;--lime:#A6D84A;--red:#D9262C;--ink:#1B1F2A;--mut:#626875;--line:#E4E3DD;--bg:#F5F4F0;--card:#FFFFFF;--amber:#C98A12;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--g)}
.app{display:grid;grid-template-rows:60px 1fr;height:100vh}
/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--g);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--mut);letter-spacing:0}
.chips{display:flex;gap:8px;margin-left:14px;flex-wrap:nowrap;min-width:0}
.chip{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:330px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:#C9C9C2;flex:none}
.chip.ok .dot{background:#2E9D4E}.chip.warn{border-color:#F0D58A;background:#FFF8E6}.chip.warn .dot{background:var(--amber)}
.chip.busy .dot{background:var(--g);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.sp{flex:1}
.btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#cfcdc4}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff}.btn.pri:hover{background:var(--g2)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
/* main */
.main{display:grid;grid-template-columns:380px 1fr;min-height:0}
.side{border-right:1px solid var(--line);background:#fff;overflow:auto;min-height:0}
.stage{overflow:auto;min-height:0;position:relative}
.pane{padding:18px}
.h{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin:0 0 16px}
.lbl{display:block;font-size:12px;font-weight:700;margin:14px 0 6px}
.lbl span{font-weight:500;color:var(--mut)}
.in{width:100%;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:#FAFAF8;outline:none}
textarea.in{height:auto;padding:9px 11px;resize:vertical;line-height:1.45}
.in:focus{border-color:var(--g);background:#fff;box-shadow:0 0 0 3px rgba(14,92,47,.1)}
.drop{border:2px dashed #D3D1C8;border-radius:14px;padding:22px 16px;text-align:center;background:#FBFBF9;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--g);background:var(--gl)}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.drop .ic{font-size:26px;color:var(--g);font-weight:800;line-height:1;margin-bottom:6px}
.files{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12.5px}
.file img{width:40px;height:40px;object-fit:contain;border-radius:6px;background:#F3F3EF;flex:none}
.file .t{flex:1;min-width:0}.file .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .t span{color:var(--mut)}
.x{width:26px;height:26px;border-radius:7px;border:0;background:transparent;color:var(--mut);font-size:16px;flex:none}
.x:hover{background:#F3F2EE;color:var(--red)}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{text-align:left;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.tpl.on{border-color:var(--g);background:var(--gl)}
.tpl b{display:block;font-size:13px}.tpl span{font-size:11.5px;color:var(--mut);line-height:1.3;display:block}
.wire{height:46px;border-radius:7px;background:#F2F0EA;margin-bottom:8px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px;overflow:hidden}
.wire i{display:block;border-radius:2px;flex:none}
.go{width:100%;height:48px;font-size:15px;margin-top:18px;border-radius:11px}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.warnbox{padding:10px 12px;border-radius:10px;background:#FFF8E6;border:1px solid #F0D58A;font-size:12.5px;margin-top:10px}
/* outline */
.det{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;background:#FCFCFA}
.det summary{font-weight:700;cursor:pointer;font-size:13px;list-style:none;display:flex;align-items:center;gap:6px}
.det summary::after{content:'▾';margin-left:auto;color:var(--mut)}
.blk{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff;overflow:hidden}
.blk.sel{border-color:var(--g);box-shadow:0 0 0 3px rgba(14,92,47,.08)}
.bh{display:flex;align-items:center;gap:8px;padding:9px 8px 9px 12px;cursor:pointer}
.bh .ty{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--mut);text-transform:uppercase}
.bh .nm{font-weight:650;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bh .meta{flex:1;min-width:0}
.ib{width:28px;height:28px;border-radius:7px;border:0;background:transparent;color:var(--mut);font-size:14px;display:grid;place-items:center;flex:none}
.ib:hover{background:#F1F0EB;color:var(--ink)}
.bb{padding:4px 12px 14px;border-top:1px solid #F0EFEA}
.items{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.it{display:grid;grid-template-columns:52px 1fr auto;gap:9px;align-items:center;padding:7px;border:1px solid var(--line);border-radius:10px;background:#fff}
.it.sel{border-color:var(--red);box-shadow:0 0 0 3px rgba(217,38,44,.08)}
.it .th{width:52px;height:52px;border-radius:8px;background:#F4F3EF;display:grid;place-items:center;overflow:hidden;position:relative}
.it .th img{width:100%;height:100%;object-fit:contain}
.it .th .ld{position:absolute;inset:0;background:rgba(255,255,255,.8);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--g)}
.it .nm{font-weight:650;font-size:12.5px;line-height:1.25}
.it .no{font-size:11.5px;color:var(--mut)}
.it .act{display:flex;gap:0}
.it .miss{color:var(--red);font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;height:30px;padding:0 12px;font-size:12px;font-weight:600}
.seg button.on{background:var(--g);color:#fff}
.addmenu{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.addmenu button{text-align:left;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12.5px;font-weight:600}
.addmenu button span{display:block;font-weight:400;font-size:11px;color:var(--mut)}
/* stage */
.stagebar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(245,244,240,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.hint{font-size:12px;color:var(--mut)}
.canvas{display:flex;justify-content:center;padding:26px 18px 80px}
.frame{width:640px;max-width:100%;transition:width .2s;border-radius:6px;overflow:hidden;box-shadow:0 10px 30px rgba(27,31,42,.12);background:#F2F0EA}
.frame.phone{width:390px;border-radius:30px;border:9px solid #1B1F2A}
.frame iframe{display:block;width:100%;border:0;height:1600px;background:#F2F0EA}
.empty{display:grid;place-items:center;height:calc(100vh - 140px);text-align:center;color:var(--mut)}
.empty .big{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin-bottom:6px}
.busyov{position:absolute;inset:0;background:rgba(245,244,240,.75);display:none;place-items:center;z-index:20}
.busyov.on{display:grid}
.busyov .card{background:#fff;border-radius:14px;padding:20px 26px;box-shadow:0 10px 40px rgba(0,0,0,.12);display:flex;align-items:center;gap:14px;font-weight:600}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid #DCEBDD;border-top-color:var(--g);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* modal */
.modal{position:fixed;inset:0;background:rgba(27,31,42,.45);display:none;align-items:flex-start;justify-content:center;padding:50px 20px;z-index:50;overflow:auto}
.modal.on{display:flex}
.mbox{width:min(760px,100%);background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.3);padding:24px 26px 26px}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mhead h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:16px 0;border-top:1px solid #EFEEE9}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800}
.step .n.done{background:#2E9D4E}
.step h3{margin:3px 0 4px;font-size:15px}
.step p{margin:0 0 10px;color:var(--mut);font-size:13px}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.as{border:1px solid var(--line);border-radius:10px;padding:6px;font-size:11px;display:flex;gap:6px;align-items:center}
.as img{width:34px;height:34px;object-fit:contain;flex:none;background:#F4F3EF;border-radius:5px}
.as .s{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as.ok{border-color:#9BD3A9;background:#F2FAF4}
.bm{display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:15px;background:var(--red);color:#fff;font-weight:700;font-size:12.5px;text-decoration:none;cursor:grab}
.saved{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.sv{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sv .im{aspect-ratio:2/1;background:#F2F0EA;display:grid;place-items:center;overflow:hidden}
.sv .im img{width:100%;height:100%;object-fit:cover}
.sv .b{padding:10px}
.sv b{display:block;font-size:13px}.sv span{font-size:11.5px;color:var(--mut)}
.checks{margin:8px 0 0;padding:0;list-style:none;font-size:12.5px}
.checks li{padding:3px 0}.checks li::before{content:'●';margin-right:7px;color:var(--amber)}
.checks li.ok::before{color:#2E9D4E}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-weight:500;z-index:80;max-width:90vw;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.kbd{font-size:11px;color:var(--mut)}
.pop{position:absolute;z-index:30}
.stp{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin:20px 0 8px}
.stp span{width:22px;height:22px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:12px}
.stp em{font-style:normal;font-weight:500;color:var(--mut);font-size:12px}
.looks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.look{padding:7px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left}
.look.on{border-color:var(--g);box-shadow:0 0 0 3px rgba(14,92,47,.12)}
.look b{display:block;font-size:12px;margin-top:6px}.look span{display:block;font-size:10.5px;color:var(--mut);line-height:1.25}
.look .lk{height:52px;border-radius:7px;background:#F2F0EA;display:flex;flex-direction:column;gap:2px;padding:5px;justify-content:flex-start;overflow:hidden}
.look .lk i{display:block;height:5px;border-radius:2px;width:100%}
.look .lk span{margin:auto;font-weight:800;color:var(--g);font-size:12px}
.look.sm{width:38px;padding:3px;border-radius:8px}.look.sm .lk{height:30px;padding:3px;gap:1px}.look.sm .lk i{height:3px}
.col2{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.inbox{width:640px;max-width:100%;display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px}
.inbox.phone{width:390px}
.inbox .av{width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.inbox .m{min-width:0;flex:1}.inbox .m>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox .sj{font-weight:600}.inbox .ph{color:var(--mut)}
.home{width:100%;max-width:980px;padding:10px 6px}
.home h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:6px 0 4px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.hc{text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;position:relative}
.hc b{display:block;font-size:14px;margin-bottom:4px}.hc span{font-size:12.5px;color:var(--mut)}
.hc .dot{position:absolute;right:14px;top:16px;width:10px;height:10px;border-radius:50%;background:#C9C9C2}
.hc .dot.ok{background:#2E9D4E}.hc .dot.warn{background:var(--amber)}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="mark">R</div><div>Email Studio<small>Resnick Distributors</small></div></div>
    <div class="chips">
      <button class="chip" id="chipImg"><span class="dot"></span><span class="t">Images folder</span></button>
      <button class="chip" id="chipCat"><span class="dot"></span><span class="t">Catalog</span></button>
    </div>
    <div class="sp"></div>
    <button class="btn" id="bNew">New email</button>
    <button class="btn" id="bSaved">Saved emails</button>
    <button class="btn ghost" id="bSettings" title="Settings">Settings</button>
    <button class="btn pri" id="bExport">Get it ready to send →</button>
  </header>
  <div class="main">
    <aside class="side" id="side"></aside>
    <section class="stage" id="stage">
      <div class="stagebar">
        <div class="seg" id="viewSeg"><button data-v="desktop" class="on">Desktop</button><button data-v="phone">Phone</button></div>
        <span class="hint" id="stageHint">Click any text in the email to edit it. Click a product to change it.</span>
        <div class="sp"></div>
        <span class="kbd" id="saveInd"></span><button class="btn sm" id="bUndo" title="Undo">↶ Undo</button>
      </div>
      <div class="canvas" id="canvas"></div>
      <div class="busyov" id="busy"><div class="card"><div class="spin"></div><span id="busyT">Working…</span></div></div>
    </section>
  </div>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" hidden multiple>

// ================= banner drawing (static + animated) =================
function wrapText(x, text, maxW) { const out = []; String(text || '').split('\n').forEach(par => { let cur = ''; par.split(/\s+/).forEach(w => { const t = cur ? cur + ' ' + w : w; if (x.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }); if (cur) out.push(cur); }); return out; }
async function loadImg(src) { const im = new Image(); im.src = src; await im.decode(); return im; }
function roundRect(x, X, Y, w, h, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r); x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath(); }
const ease = t => 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3);
const easeBack = t => { t = Math.max(0, Math.min(1, t)); const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
// Draws one banner frame at 1200x620 design size. t = entry progress (1 = settled), f = frame counter for effects.
function drawBanner(x, L, s, t = 1, f = 0, flat = false) {
  const W = 1200, H = 620, hp = L.hero;
  if (flat) { x.fillStyle = hp.bg; x.fillRect(0, 0, W, H); }
  else { const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, hp.bg); g.addColorStop(1, hp.bg2); x.fillStyle = g; x.fillRect(0, 0, W, H); }
  x.fillStyle = hp.shape; x.beginPath(); x.arc(990, 110, 380, 0, Math.PI * 2); x.fill();
  if (hp.fx === 'stripes') { x.save(); x.globalAlpha = 0.14; x.fillStyle = hp.accent; for (let i = -2; i < 8; i++) { x.beginPath(); const o = i * 70 + (f * 6) % 70; x.moveTo(820 + o, 0); x.lineTo(850 + o, 0); x.lineTo(700 + o, H); x.lineTo(670 + o, H); x.fill(); } x.restore(); }
  const serif = hp.serif, L0 = 64, a = ease(t), dx = (1 - a) * -50;
  x.save(); x.globalAlpha = a; x.translate(dx, 0);
  let y = 112;
  if (s.eyebrow) { x.fillStyle = hp.accent; x.font = '700 22px Inter, Arial, sans-serif'; try { x.letterSpacing = '4px'; } catch (e) {} wrapText(x, String(s.eyebrow).toUpperCase(), 540).slice(0, 2).forEach(l => { x.fillText(l, L0, y); y += 30; }); try { x.letterSpacing = '0px'; } catch (e) {} }
  x.fillStyle = hp.accent; x.fillRect(L0, y - 6, 56 * ease(t * 1.3), 6); y += 60;
  const fam = serif ? `Georgia, 'Times New Roman', serif` : `"Archivo Black", "Arial Black", Arial, sans-serif`, wt = serif ? 'bold ' : '';
  const maxW = s.imgs && s.imgs.length ? 560 : 1000;
  let fs = s.big ? 80 : 74; x.font = `${wt}${fs}px ${fam}`; let lines = wrapText(x, s.title, maxW);
  while ((lines.length > 3 || lines.some(l => x.measureText(l).width > maxW + 20)) && fs > 40) { fs -= 4; x.font = `${wt}${fs}px ${fam}`; lines = wrapText(x, s.title, maxW); }
  x.fillStyle = hp.text; lines.slice(0, 4).forEach(l => { x.fillText(l, L0, y); y += fs * 1.08; });
  if (s.sub) { y += 12; x.font = '500 27px Inter, Arial, sans-serif'; x.fillStyle = hp.sub; wrapText(x, s.sub, maxW - 40).slice(0, 2).forEach(l => { x.fillText(l, L0, y); y += 36; }); }
  if (s.pill) { x.font = '700 21px Inter, Arial, sans-serif'; const pw = x.measureText(s.pill).width + 44, py = Math.min(H - 84, y + 16); x.fillStyle = hp.pill; roundRect(x, L0, py, pw, 52, 26); x.fill(); x.fillStyle = hp.pillText; x.fillText(s.pill, L0 + 22, py + 33); }
  x.restore();
  const spots = [[700, 70, 250, -5], [930, 150, 230, 4], [760, 330, 230, 3]];
  (s.imgs || []).slice(0, 3).forEach((im, i) => {
    const [px, py, sz, rot] = spots[i], k = easeBack((t - 0.15 - i * 0.12) / 0.55); if (k <= 0) return;
    x.save(); x.translate(px + sz / 2, py + sz / 2); x.rotate(rot * Math.PI / 180); x.scale(k, k);
    x.shadowColor = 'rgba(0,0,0,0.30)'; x.shadowBlur = 30; x.shadowOffsetY = 14;
    x.fillStyle = '#fff'; roundRect(x, -sz / 2, -sz / 2, sz, sz, 22); x.fill(); x.shadowColor = 'transparent';
    x.save(); roundRect(x, -sz / 2, -sz / 2, sz, sz, 22); x.clip(); x.drawImage(im, -sz / 2, -sz / 2, sz, sz); x.restore();
    if (s.badges && s.badges[i]) { x.rotate(-rot * Math.PI / 180); x.fillStyle = L.deal; x.beginPath(); x.arc(sz / 2 - 18, -sz / 2 + 18, 46, 0, Math.PI * 2); x.fill(); x.fillStyle = '#fff'; x.font = '800 19px Inter, Arial, sans-serif'; x.textAlign = 'center'; wrapText(x, s.badges[i], 80).slice(0, 2).forEach((l, j, arr) => x.fillText(l, sz / 2 - 18, -sz / 2 + 25 + (j - (arr.length - 1) / 2) * 21)); x.textAlign = 'left'; }
    x.restore();
  });
  if (hp.fx === 'snow') { x.fillStyle = 'rgba(255,255,255,0.85)'; for (let i = 0; i < 70; i++) { const sx = (i * 197.3) % W, sy = ((i * 89.7) + f * (6 + (i % 4) * 3)) % H, r = 2 + (i % 3) * 1.6; x.beginPath(); x.arc(sx + Math.sin((f + i) / 5) * 6, sy, r, 0, Math.PI * 2); x.fill(); } }
}
async function bannerFonts() { try { await Promise.all([document.fonts.load('64px "Archivo Black"'), document.fonts.load('700 24px Inter'), document.fonts.load('500 24px Inter'), document.fonts.load('800 24px Inter')]); } catch (er) {} }
async function heroSlides(e) {
  const b = e.blocks.find(x => x.type === 'hero'), imgsOf = async its => (await Promise.all(its.filter(i => i.img && e.assets[i.img]).slice(0, 3).map(i => loadImg(e.assets[i.img]).catch(() => null)))).filter(Boolean);
  const slides = [{ eyebrow: b.eyebrow, title: b.title, sub: b.sub, pill: 'Order in the Resnick app  →', imgs: await imgsOf(allItems()) }];

      slides.push({ eyebrow: blk.eyebrow || '', title: blk.type === 'spotlight' ? (blk.item.name || '') : blk.title, sub: blk.type === 'spotlight' ? (blk.item.deal || '') : '', pill: '', imgs: await imgsOf(its), badges: its.slice(0, 3).map(i => i.deal ? i.deal.replace(/\s+(a|per|on|off)\s.*$/i, m => /off/i.test(m) ? ' OFF' : '') : '') });

async function renderHero() {
  const e = st.email; if (!e) return; const b = e.blocks.find(x => x.type === 'hero'); if (!b || b.mode === 'image') return;

async function renderGif(L, slides, onProgress) {
  const W = 600, H = 310, c = canvasEl(W, H), x = c.getContext('2d', { willReadFrequently: true });
  const enc = gifenc.GIFEncoder(), frames = [], ENTRY = 7, snow = L.hero.fx === 'snow' || L.hero.fx === 'stripes';
  slides.forEach((s, si) => {
    for (let k = 0; k < ENTRY; k++) frames.push({ s, t: 0.12 + 0.88 * k / (ENTRY - 1), delay: 70 });
    if (snow) { for (let k = 0; k < 8; k++) frames.push({ s, t: 1, delay: si === slides.length - 1 ? 300 : 220, hold: true }); }
    else frames.push({ s, t: 1, delay: si === slides.length - 1 ? 2600 : 1900 });
  });
  let fcount = 0;
  for (let i = 0; i < frames.length; i++) {
    const fr = frames[i];
    x.setTransform(0.5, 0, 0, 0.5, 0, 0); drawBanner(x, L, fr.s, fr.t, fcount++, true); x.setTransform(1, 0, 0, 1, 0, 0);

}

    <details style="margin-top:10px"><summary style="cursor:pointer;font-size:12.5px;font-weight:600;color:var(--g)">How it works (one-time setup)</summary>
      <p style="font-size:12.5px;margin:8px 0">Drag this button to your bookmarks bar: <a class="bm" id="bmRadar" href="#">Make Radar links</a></p>
      <p style="font-size:12.5px;margin:0">Click <b>Copy item list &amp; open Radar</b>. In Radar go to <b>Messaging</b>, then <b>Deep Link Library</b>, and click <b>Make Radar links</b> in your bookmarks bar. Leave the tab alone while it works. The links come back here by themselves. If not, click <b>Paste links</b>.</p>

async function zipImages() {
  const e = st.email, keys = usedAssets(e);
  if (!window.JSZip) { try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'); } catch (er) { } }
  if (window.JSZip) { const z = new JSZip(); keys.forEach(k => z.file(fileName(e, k), dataUrlToBlob(e.assets[k]))); download(await z.generateAsync({ type: 'blob' }), (e.name || 'email').replace(/[^\w\- ]+/g, '').trim() + ' images.zip'); }
  else for (const k of keys) { download(dataUrlToBlob(e.assets[k]), fileName(e, k)); await sleep(300); }
}
function applyCc(t) {
  let links = {}; if (t && typeof t === 'object') links = t; else { const s = String(t || ''), i = s.indexOf('{'); if (i >= 0) try { links = JSON.parse(s.slice(i)).links || {}; } catch (er) {} }
  const base = n => String(n || '').toLowerCase().replace(/\.(png|jpe?g|gif|webp)$/i, '').trim();
  const e = st.email; if (!e) return; let n = 0; const keys = usedAssets(e);
  keys.forEach(k => { const u = links[base(fileName(e, k))]; if (u && /^https?:\/\//.test(u)) { e.hosted[k] = u; n++; } });
  if (!n) return toast('No matching image links found. Make sure the file names weren\'t changed in Constant Contact.');
  if (e.hosted.logo && S.logoData) { S.logo = e.hosted.logo; S.logoData = ''; saveSettings(); }
  save(); toast(`${n} of ${keys.length} image links filled in.`); if ($('#modal').classList.contains('on')) openExport();
}
window.addEventListener('message', ev => { if (ev.data && ev.data.type === 'resnick-cc') applyCc(ev.data.links || {}); });
// The Constant Contact helper runs as a bookmarklet inside the CC Library page.
async function ccHelper() {
  const H = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const old = document.getElementById('rk-cc'); if (old) old.remove();
  const box = document.createElement('div'); box.id = 'rk-cc';
  box.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:2147483647;width:340px;max-height:60vh;overflow:auto;background:#fff;border:2px solid #0E5C2F;border-radius:10px;padding:14px 16px;font:14px/1.45 Arial,sans-serif;color:#1E2230;box-shadow:0 10px 30px rgba(0,0,0,.25)';
  document.body.appendChild(box);
  const say = h => { box.innerHTML = '<div style="font-weight:bold;color:#0E5C2F;margin-bottom:6px">Resnick image links</div>' + h; };
  const base = n => String(n || '').toLowerCase().replace(/\.(png|jpe?g|gif|webp)$/i, '').trim();
  const docs = [document]; document.querySelectorAll('iframe').forEach(f => { try { if (f.contentDocument && f.contentDocument.body) docs.push(f.contentDocument); } catch (e) {} });
  let rows = []; docs.forEach(d => rows.push(...d.querySelectorAll('tr.file, tr[data-file-id]')));
  if (!rows.length) {
    const fr = [...document.querySelectorAll('iframe')].find(f => { let x = true; try { x = !f.contentDocument; } catch (e) {} const r = f.getBoundingClientRect(); return x && f.src && r.width > 400 && r.height > 300; });
    if (fr) { say('The Library is inside a frame I can\'t read.<div style="margin-top:10px"><button id="rk-cc-go" style="height:32px;padding:0 12px;border:0;border-radius:6px;background:#0E5C2F;color:#fff;font-weight:bold;cursor:pointer">Open Library on its own page</button></div><div style="margin-top:8px">Then click <b>Recently Added</b> and click this bookmark again.</div>'); box.querySelector('#rk-cc-go').onclick = () => { location.href = fr.src; }; return; }
    say('Open <b>Library</b> and click <b>Recently Added</b> (list view), then click this bookmark again.'); return;
  }
  let want = null, raw = '';
  try { raw = await navigator.clipboard.readText(); } catch (e) {}
  if (/RESNICK-FILES/.test(raw)) { try { localStorage.setItem('rk-files', raw); } catch (e) {} } else { try { raw = localStorage.getItem('rk-files') || ''; } catch (e) {} }
  try { const j = JSON.parse(raw.slice(raw.indexOf('{'))); if (Array.isArray(j.files) && j.files.length) want = new Set(j.files.map(base)); } catch (e) {}
  const out = {};
  for (const tr of rows) {
    const nameEl = tr.querySelector('a.file-name, .file-name'); const name = base(nameEl ? nameEl.textContent : ''); if (!name || out[name]) continue;
    if (want && !want.has(name)) continue;
    const im = tr.querySelector('img.preview, img'); if (!im) continue;
    let u = im.getAttribute('data-href') || (im.getAttribute('src') || '').replace(/-thumbnail(\.\w+)/, '$1');
    u = u.replace(/[?#].*$/, '').replace(/^https?:\/\/mlsvc01-prod\.s3\.amazonaws\.com\//i, 'https://files.constantcontact.com/');
    if (/^https?:\/\//.test(u)) out[name] = u;
  }
  const count = Object.keys(out).length, payload = 'RESNICK-CC ' + JSON.stringify({ links: out });
  let sent = false; try { if (window.opener) { window.opener.postMessage({ type: 'resnick-cc', links: out }, '*'); sent = true; } } catch (e) {}
  let copied = false; try { await navigator.clipboard.writeText(payload); copied = true; } catch (e) {}
  const missing = want ? [...want].filter(k => !out[k]) : [];
  say('<div><b>' + count + '</b> image link' + (count === 1 ? '' : 's') + ' found.</div>' + (missing.length ? '<div style="color:#D9262C;margin-top:6px">Not on this page: ' + missing.map(H).join(', ') + '. Upload them (or go to the next page) and click the bookmark again.</div>' : '') + '<div style="margin-top:8px">' + (sent ? 'Sent to Email Studio. ' : '') + (copied ? 'Copied too. If they did not show up, click <b>Paste links</b> in Email Studio and press Ctrl+V.' : 'Click Copy links, then paste in Email Studio.') + '</div><div style="display:flex;gap:8px;margin-top:10px"><button id="rk-cc-copy" style="height:32px;padding:0 12px;border:0;border-radius:6px;background:#0E5C2F;color:#fff;font-weight:bold;cursor:pointer">Copy links</button><button id="rk-cc-close" style="height:32px;padding:0 12px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer">Close</button></div>');
  box.querySelector('#rk-cc-copy').onclick = async () => { try { await navigator.clipboard.writeText(payload); box.querySelector('#rk-cc-copy').textContent = 'Copied'; } catch (e) { prompt('Copy this, then paste it in Email Studio:', payload); } };
  box.querySelector('#rk-cc-close').onclick = () => box.remove();
}
function ccBookmarklet() { return 'javascript:' + encodeURIComponent('(' + ccHelper.toString() + ')();void 0'); }

async function openSaved() {

  openModal(`<div class="mhead"><h2>Saved emails</h2><button class="btn ghost" data-close>Close</button></div>
  <p class="sub">Everything saves automatically. Open one to edit it, or duplicate it to start next week's email.</p>
  ${all.length ? `<div class="saved">${all.map(r => `<div class="sv"><div class="im">${r.assets && r.assets.hero ? `<img src="${r.assets.hero}" alt="">` : ''}</div><div class="b"><b>${esc(r.name)}</b><span>${new Date(r.updated).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</span><div class="row" style="margin-top:8px"><button class="btn sm pri" data-open="${r.id}">Open</button><button class="btn sm" data-copy="${r.id}">Duplicate</button><button class="btn sm ghost" data-drop="${r.id}" style="color:#C33">Delete</button></div></div></div>`).join('')}</div>` : '<p class="note">Nothing saved yet.</p>'}`, box => {

      if (t.dataset.drop) { if (!confirm('Delete this email?')) return; await DB.drop(t.dataset.drop); if (st.email && st.email.id === t.dataset.drop) { st.email = null; render(); } openSaved(); }

    $('#sFolder', box).onclick = () => { closeModal(); connectFolder(); };
  });
